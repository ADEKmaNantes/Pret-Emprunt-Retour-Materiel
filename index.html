<style>
  html, body{
    margin:0;
    height:100%;
    background:#f8a82b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .splash{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    animation:fadein .5s ease;
  }
  .splash img{
    width:min(70vw, 320px);
    height:auto;
    display:block;
  }
  .splash .loader{
    width:34px;
    height:34px;
    border:4px solid rgba(28,39,51,.25);
    border-top-color:#1c2733;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  .splash .fallback{
    margin-top:6px;
    font-size:13px;
    color:#1c2733;
    opacity:.7;
  }
  .splash .fallback a{color:#1c2733; font-weight:700;}
  @keyframes fadein{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }
</style>
